<!DOCTYPE html>
<html lang="en">
<head>
    <title>FreshMart - Order Successful</title>
    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="css/style.css">
</head>
<body>
<!-- =========================
     NAVBAR
========================= -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
    <div class="container">
        <a
            class="navbar-brand fw-bold text-success"
            href="index.html">
            <i class="fa-solid fa-cart-shopping"></i>
            FreshMart
        </a>
    </div>
</nav>
<!-- =========================
     ORDER SUCCESS
========================= -->
<section class="py-5">
    <div class="container">
        <div
            class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div
                    class="card shadow-sm text-center border-0">
                    <div class="card-body p-5">
                        <!-- SUCCESS ICON -->
                        <div class="mb-4">
                            <i
                                class="fa-solid fa-circle-check text-success"
                                style="font-size:80px;">
                            </i>
                        </div>
                        <h1 class="fw-bold text-success">
                            Order Placed Successfully!
                        </h1>
                        <p class="text-muted mt-3">
                            Thank you for shopping with FreshMart.
                        </p>
                        <!-- ORDER NUMBER -->
                        <div class="alert alert-light border mt-4">
    <p class="mb-2">
        <strong>
            Order ID:
        </strong>
        <span id="orderId">
            FM000000
        </span>
    </p>
    <p class="mb-0">
        <strong>
            Order Total:
        </strong>
        <span class="text-success fw-bold">
            ₹<span id="orderTotal">0</span>
        </span>
    </p>
</div>
                        <!-- BUTTONS -->
                        <div
                            class="d-flex justify-content-center gap-3 mt-4 flex-wrap">
                            <a
                                href="index.html"
                                class="btn btn-success">
                                <i class="fa-solid fa-house"></i>
                                Back to Home
                            </a>
                            <a
                                href="index.html#products"
                                class="btn btn-outline-success">
                                <i class="fa-solid fa-bag-shopping"></i>
                                Continue Shopping
                            </a>
                            <a
    href="orders.html"
    class="btn btn-outline-primary">
    <i class="fa-solid fa-box"></i>
    My Orders
</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<script>
// ORDER ID //
const orderId =
    localStorage.getItem(
        "freshMartLastOrderId"
    ) || "FM000000";
document.getElementById(
    "orderId"
).textContent = orderId;
// ORDER TOTAL // 
const orderTotal =
    localStorage.getItem("freshMartOrderTotal") || 0;
document.getElementById(
    "orderTotal"
).textContent = orderTotal;
// Remove saved total after displaying it
localStorage.removeItem(
    "freshMartOrderTotal"
);
</script>
</body>
</html>
