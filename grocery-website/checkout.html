<!DOCTYPE html>
<html lang="en">
<head>
    <title>FreshMart - Checkout</title>
    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="css/style.css">
</head>
<body>
<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold text-success"
            href="index.html">
            <i class="fa-solid fa-cart-shopping"></i>
            FreshMart
        </a>
        <a
            href="index.html"
            class="btn btn-outline-success">
            <i class="fa-solid fa-arrow-left"></i>
            Continue Shopping
        </a>
        <a
    href="orders.html"
    class="btn btn-outline-primary ms-2">
    <i class="fa-solid fa-box"></i>
    My Orders
</a>
    </div>
</nav>
<!-- =========================
     CHECKOUT
========================= -->
<section class="py-5">
    <div class="container">
        <div class="text-center mb-5">
            <h1 class="fw-bold">
                <i class="fa-solid fa-credit-card text-success"></i>
                Checkout
            </h1>
            <p class="text-muted">
                Complete your order details
            </p>
        </div>
        <div class="row g-4">
            <!-- =========================
                 CUSTOMER DETAILS
            ========================= -->
            <div class="col-lg-7">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h4 class="mb-4">
                            <i class="fa-solid fa-user text-success"></i>
                            Customer Details
                        </h4>
                        <form id="checkoutForm">
                            <div class="mb-3">
                                <label
                                    class="form-label">
                                    Full Name
                                </label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="customerName"
                                    placeholder="Enter your name"
                                    required>
                            </div>
                            <div class="mb-3">
                                <label
                                    class="form-label">
                                    Mobile Number
                                </label>
                                <input
                                    type="tel"
                                    class="form-control"
                                    id="customerPhone"
                                    placeholder="Enter 10-digit mobile number"
                                    pattern="[0-9]{10}"
                                    maxlength="10"
                                    required>
                            </div>
                            <div class="mb-3">
                                <label
                                    class="form-label">
                                    Email Address
                                </label>
                                <input
                                    type="email"
                                    class="form-control"
                                    id="customerEmail"
                                    placeholder="Enter email address"
                                    required>
                            </div>
                            <div class="mb-3">
                                <label
                                    class="form-label">
                                    Delivery Address
                                </label>
                                <textarea
                                    class="form-control"
                                    id="customerAddress"
                                    rows="4"
                                    placeholder="Enter complete delivery address"
                                    required></textarea>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label
                                        class="form-label">
                                        City
                                    </label>
                                    <input
                                        type="text"
                                        class="form-control"
                                        id="customerCity"
                                        placeholder="City"
                                        required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label
                                        class="form-label">
                                        Pincode
                                    </label>
                                    <input
                                        type="text"
                                        class="form-control"
                                        id="customerPincode"
                                        placeholder="Enter 6-digit Pincode"
                                        pattern="[0-9]{6}"
                                        maxlength="6"
                                        required>
                                </div>
                            </div>
                            <h4 class="mt-4 mb-3">
                                <i class="fa-solid fa-wallet text-success"></i>
                                Payment Method
                            </h4>
                            <div class="form-check mb-2">
                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="paymentMethod"
                                    id="cod"
                                    value="Cash on Delivery"
                                    checked>
                                <label
                                    class="form-check-label"
                                    for="cod">
                                    <i class="fa-solid fa-money-bill"></i>
                                    Cash on Delivery
                                </label>
                            </div>
                            <div class="form-check mb-4">
                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="paymentMethod"
                                    id="onlinePayment"
                                    value="Online Payment">
                                <label
                                    class="form-check-label"
                                    for="onlinePayment">
                                    <i class="fa-solid fa-mobile-screen-button"></i>
                                    Online Payment
                                </label>
                            </div>
                            <button
                                type="submit"
                                class="btn btn-success btn-lg w-100">
                                <i class="fa-solid fa-check"></i>
                                Place Order
                            </button>
                        </form>
                    </div>
                </div>
            </div>
    <!--  ORDER SUMMARY -->
            <div class="col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h4 class="mb-4">
                            <i class="fa-solid fa-bag-shopping text-success"></i>
                            Order Summary
                        </h4>
                        <div id="checkoutItems">
                            <p class="text-muted text-center">
                                Loading cart...
                            </p>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between">
                            <span>
                                Subtotal
                            </span>
                            <strong>
                                ₹<span id="checkoutSubtotal">0</span>
                            </strong>
                        </div>
                        <div class="d-flex justify-content-between mt-2">
                            <span>
                                Delivery
                            </span>
                            <strong class="text-success">
                                FREE
                            </strong>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between">
                            <h5>
                                Total
                            </h5>
                            <h5 class="text-success">
                                ₹<span id="checkoutTotal">0</span>
                            </h5>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<!-- =========================
     JAVASCRIPT
========================= -->
<script>
    // =========================
    // LOAD CART
    // =========================
    const checkoutCart =
        JSON.parse(
            localStorage.getItem("freshMartCart")
        ) || [];
    const checkoutItems =
        document.getElementById("checkoutItems");
    const checkoutSubtotal =
        document.getElementById("checkoutSubtotal");
    const checkoutTotal =
        document.getElementById("checkoutTotal");
    let total = 0;
    // DISPLAY CART // 
    if (checkoutCart.length === 0) {
        checkoutItems.innerHTML = `
            <div class="text-center">
                <p class="text-muted">
                    Your cart is empty.
                </p>
                <a
                    href="index.html"
                    class="btn btn-success">
                    Continue Shopping
                </a>
            </div>
        `;
    } else {
        checkoutItems.innerHTML = "";
        checkoutCart.forEach(function(product) {
            const itemTotal =
                product.price * product.quantity;
            total += itemTotal;
            checkoutItems.innerHTML += `
                <div class="d-flex align-items-center mb-3">
                    <img
                        src="${product.image}"
                        alt="${product.name}"
                        style="
                            width:60px;
                            height:60px;
                            object-fit:contain;
                        ">
                    <div class="ms-3 flex-grow-1">
                        <h6 class="mb-1">
                            ${product.name}
                        </h6>
                        <small class="text-muted">
                            ₹${product.price}
                            ×
                            ${product.quantity}
                        </small>
                    </div>
                    <strong>
                        ₹${itemTotal}
                    </strong>
                </div>
            `;
        });
        checkoutSubtotal.textContent =
            total;
        checkoutTotal.textContent =
            total;
    }
// SAVE CUSTOMER DETAILS //
document
    .getElementById("checkoutForm")
    .addEventListener("input", function() {
        const customerDetails = {
            name:
                document.getElementById("customerName").value,
            phone:
                document.getElementById("customerPhone").value,
            email:
                document.getElementById("customerEmail").value,
            address:
                document.getElementById("customerAddress").value,
            city:
                document.getElementById("customerCity").value,
            pincode:
                document.getElementById("customerPincode").value
        };
        localStorage.setItem(
            "freshMartCustomer",
            JSON.stringify(customerDetails)
        );
    });
// LOAD SAVED CUSTOMER DETAILS //
const savedCustomer =
    JSON.parse(
        localStorage.getItem("freshMartCustomer")
    );
if (savedCustomer) {
    document.getElementById("customerName").value =
        savedCustomer.name || "";
    document.getElementById("customerPhone").value =
        savedCustomer.phone || "";
    document.getElementById("customerEmail").value =
        savedCustomer.email || "";
    document.getElementById("customerAddress").value =
        savedCustomer.address || "";
    document.getElementById("customerCity").value =
        savedCustomer.city || "";
    document.getElementById("customerPincode").value =
        savedCustomer.pincode || "";
}
    // PLACE ORDER // 
    document
        .getElementById("checkoutForm")
        .addEventListener("submit", function(event) {
            event.preventDefault();
            if (checkoutCart.length === 0) {
                alert(
                    "Your cart is empty!"
                );
                return;
            }
            const customerName =
                document.getElementById(
                    "customerName"
                ).value;
            alert(
                "Thank you " +
                customerName +
                "! Your order has been placed successfully."
            );
            // Calculate final order total
let finalOrderTotal = 0;
checkoutCart.forEach(function(product) {
    finalOrderTotal +=
        product.price * product.quantity;
});
// SAVE ORDER // 
const orderId =
    "FM" +
    Date.now()
        .toString()
        .slice(-8);
localStorage.setItem(
    "freshMartLastOrderId",
    orderId
);
// Save final order total
localStorage.setItem(
    "freshMartOrderTotal",
    finalOrderTotal
);
const orderDate =
    new Date().toLocaleString();
const paymentMethod =
    document.querySelector(
        'input[name="paymentMethod"]:checked'
    ).value;
const newOrder = {
    id: orderId,
    date: orderDate,
    customerName:
        document.getElementById("customerName").value,
    phone:
        document.getElementById("customerPhone").value,
    email:
        document.getElementById("customerEmail").value,
    address:
        document.getElementById("customerAddress").value,
    city:
        document.getElementById("customerCity").value,
    pincode:
        document.getElementById("customerPincode").value,
    items: checkoutCart,
    total: finalOrderTotal,
    paymentMethod: paymentMethod,
    status: "Order Placed"
};
let savedOrders =
    JSON.parse(
        localStorage.getItem("freshMartOrders")
    ) || [];
savedOrders.unshift(newOrder);
localStorage.setItem(
    "freshMartOrders",
    JSON.stringify(savedOrders)
);
            // Clear cart
            localStorage.removeItem(
                "freshMartCart"
            );
            // Go to homepage
            window.location.href =
                "order-success.html";
        });
</script>
</body>
</html>
